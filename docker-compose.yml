# ─────────────────────────────────────────────────────────────────────────────
# YAML extensions — reduce repetition in silo definitions.
# x-* keys are ignored by Docker Compose and serve only as anchors.
# ─────────────────────────────────────────────────────────────────────────────

x-ai-client-base: &ai-client-base
  build:
    context: .
    dockerfile: ai_client/Dockerfile
  env_file:
    - .env
  depends_on:
    hapi_fhir:
      condition: service_started
    fl_server:
      condition: service_healthy
  volumes:
    - ./etl_worker/data:/app/data:ro   # bind mount: label_index.json and FHIR bundles generated on host
    - model_cache:/root/.cache/huggingface
    - gpu_sync:/var/gpu_sync    # arquivo de lock compartilhado entre silos
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  network_mode: host

x-silo-env: &silo-env
  FL_SERVER_ADDRESS: "localhost:9091"
  FHIR_SERVER_URL: "http://localhost:8080/fhir"
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility
  GPU_LOCK_PATH: "/var/gpu_sync/gpu.lock"
  MAX_SEQ_LEN: "${MAX_SEQ_LEN:-512}"
  FL_KEEP_MODEL_IN_VRAM: "${FL_KEEP_MODEL_IN_VRAM:-false}"
  FL_MAX_EXAMPLES: "${FL_MAX_EXAMPLES:-0}"
  FL_GRADIENT_ACCUM_STEPS: "${FL_GRADIENT_ACCUM_STEPS:-0}"
  FL_BATCH_SIZE: "${FL_BATCH_SIZE:-8}"
  FL_EVAL_ACCURACY: "${FL_EVAL_ACCURACY:-false}"
  FL_TOP_K: "${FL_TOP_K:-5}"
  FL_NOISE_MULTIPLIER: "${FL_NOISE_MULTIPLIER:-0.0}"
  FL_TARGET_DELTA: "${FL_TARGET_DELTA:-1e-5}"
  FL_DP_SUBSAMPLE_RATE: "${FL_DP_SUBSAMPLE_RATE:-0.1}"
  FL_CALIBRATE_GRAD_NORM: "${FL_CALIBRATE_GRAD_NORM:-false}"
  MODEL_BACKEND: "${MODEL_BACKEND:-llm}"
  BERT_BENCHMARK: "${BERT_BENCHMARK:-full}"
  FL_PROXIMAL_MU: "${FL_PROXIMAL_MU:-0.01}"
  FL_SEED: "${FL_SEED:-42}"
  FL_CALIB_OUTPUT: "${FL_CALIB_OUTPUT:-/tmp/grad_norm.json}"
  MIMIC_HOSP_DIR: "${MIMIC_HOSP_DIR:-/physionet/mimiciv/3.1/hosp}"
  MIMIC_NOTE_DIR: "${MIMIC_NOTE_DIR:-/physionet/mimic-iv-note/2.2/note}"
  BERT_LABEL_INDEX_PATH: "${BERT_LABEL_INDEX_PATH:-/app/data/label_index.json}"
  # Parallel GPU: true = silos run concurrently (safe for models <3B).
  # Set FL_PARALLEL_GPU=false for models ≥3B or if OOM errors occur.
  FL_PARALLEL_GPU: "${FL_PARALLEL_GPU:-true}"
  # Dirichlet heterogeneity α sweep: 0.1 (high Non-IID) | 0.5 | 1.0 (near-IID)
  ETL_DIRICHLET_ALPHA: "${ETL_DIRICHLET_ALPHA:-0.5}"
  # TurboQuant: compresses LoRA deltas for gRPC transmission (bandwidth only, not VRAM)
  FL_LORA_COMPRESS: "${FL_LORA_COMPRESS:-false}"
  FL_COMPRESS_BITS: "${FL_COMPRESS_BITS:-4}"
  # Base model precision: nf4 (default, ~500 MB VRAM) | fp16 | bf16 (~2.4 GB, no BitsAndBytes)
  MODEL_BASE_PRECISION: "${MODEL_BASE_PRECISION:-nf4}"

# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─────────────────────────────────────────────
  # FHIR R4 Server (Docker path: hapiproject/hapi Java image)
  # For bare-metal, run_nodocker.sh uses fhir_server.py (Python stdlib).
  # ─────────────────────────────────────────────
  hapi_fhir:
    image: hapiproject/hapi:latest
    container_name: hapi_fhir
    environment:
      hapi.fhir.fhir_version: R4
    # hapiproject/hapi is distroless (no shell, no wget, no curl).
    # Boot wait is handled by retry logic in etl_pipeline.post_bundle.
    network_mode: host

  # ─────────────────────────────────────────────
  # FL Server — Flower SuperLink orchestrator
  # ─────────────────────────────────────────────
  fl_server:
    build:
      context: .
      dockerfile: fl_server/Dockerfile
    container_name: fl_server
    ports:
      - "9091:9091"   # gRPC SuperLink
      - "9092:9092"   # REST SuperLink (optional)
    restart: on-failure   # restart if it crashes before the first client connects
    environment:
      FL_SERVER_ADDRESS: "0.0.0.0:9091"
      FL_MIN_CLIENTS: "${FL_MIN_CLIENTS:-5}"
      FL_NUM_ROUNDS: "${FL_NUM_ROUNDS:-10}"
      FL_ROUND_TIMEOUT: "32400"   # 9h — parallel silos ~30 min/round; sequential ~1h/round
      FL_NOISE_MULTIPLIER: "${FL_NOISE_MULTIPLIER:-0}"   # DP off by default; use 0.5/1.0/2.0 for paper DP experiments
      FL_LEARNING_RATE: "${FL_LEARNING_RATE:-5e-5}"
      FL_STRATEGY: "${FL_STRATEGY:-fedprox}"
      FL_NUM_EPOCHS: "${FL_NUM_EPOCHS:-1}"
      FL_EVAL_ACCURACY: "${FL_EVAL_ACCURACY:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 9091), 2)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    network_mode: host

  # ─────────────────────────────────────────────
  # ETL Worker — MIMIC-IV extraction and FHIR bundle generation
  # ─────────────────────────────────────────────
  etl_worker:
    build:
      context: .
      dockerfile: etl_worker/Dockerfile
    container_name: etl_worker
    environment:
      FHIR_SERVER_URL: "http://localhost:8080/fhir"
      ETL_BUNDLES_PATH: "/app/etl_worker/data/bundles"
      ETL_DIRICHLET_ALPHA: "${ETL_DIRICHLET_ALPHA:-0.5}"
      PYTHONUNBUFFERED: "1"   # force immediate flush — Python buffers stdout without a TTY
    depends_on:
      hapi_fhir:
        condition: service_started
    volumes:
      - ./etl_worker/data:/app/etl_worker/data   # bind mount: FHIR bundles generated on host
    network_mode: host

  # ─────────────────────────────────────────────
  # AI Clients — 5 federated silos with GPU
  #
  # All silos share the same GPU (RTX 3060 12 GB). The "gpu_sync" volume
  # provides an fcntl.flock file that serialises GPU access — only one
  # silo uses the GPU at a time. Set FL_PARALLEL_GPU=false for models ≥3B.
  #
  # Dirichlet(α) partitioning: generated by mimic_builder.py with
  #   --n-silos 5 --dirichlet-alpha <α>
  # Silo 0..4 → partitions 0..4 (heterogeneity controlled by α)
  # ─────────────────────────────────────────────
  ai_client_silo_0:
    <<: *ai-client-base
    container_name: ai_client_silo_0
    environment:
      <<: *silo-env
      ETL_PARTITION_ID: "0"

  ai_client_silo_1:
    <<: *ai-client-base
    container_name: ai_client_silo_1
    environment:
      <<: *silo-env
      ETL_PARTITION_ID: "1"

  ai_client_silo_2:
    <<: *ai-client-base
    container_name: ai_client_silo_2
    environment:
      <<: *silo-env
      ETL_PARTITION_ID: "2"

  ai_client_silo_3:
    <<: *ai-client-base
    container_name: ai_client_silo_3
    environment:
      <<: *silo-env
      ETL_PARTITION_ID: "3"

  ai_client_silo_4:
    <<: *ai-client-base
    container_name: ai_client_silo_4
    environment:
      <<: *silo-env
      ETL_PARTITION_ID: "4"

volumes:
  model_cache:
  gpu_sync:     # lock file for serialising GPU access across silos
