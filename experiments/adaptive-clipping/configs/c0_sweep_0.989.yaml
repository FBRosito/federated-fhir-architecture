# C0 sweep — point 2/4: C0=0.989 ("calibrated" global C0)
#
# Sweep goal: show that no single flat/global C0 resolves the ~20-500x scale
# gap between encoder gradients (observed norms 0.002-0.054) and the
# classifier head (observed norm ~0.97). sigma is pinned to 1.0 across all
# 4 sweep points so epsilon is identical everywhere (verified via
# RDPAccountant: 19.0163 at every C0 in this sweep) — the only thing that
# changes point to point is the absolute noise std (C0 * sigma) and how much
# of the true gradient signal each clip threshold preserves.
#
# 0.989 is the p75 of the reconstructed total gradient-vector norm from the
# per_layer_uncalibrated logs (see prior calibration analysis). It is
# statistically indistinguishable from the original C0=1.0 because the total
# vector norm is ~99.7% dominated by the classifier head alone — this point
# exists specifically to demonstrate empirically that "recalibrating" a
# single global C0 to the real data changes nothing, since the head's own
# scale pins any global recalibration back near 1.0 regardless.
clipping_strategy: baseline_flat
sweep_c0: 0.989
sigma: 1.0
num_rounds: 20
num_seeds: 5
num_silos: 5
model: pubmedbert
dataset: mimic4
dirichlet_alpha: 0.5
global_c0: 0.989
