# C0 sweep — point 3/4: C0=0.22 (geometric-mean midpoint)
#
# Sweep goal: show that no single flat/global C0 resolves the ~20-500x scale
# gap between encoder gradients (observed norms 0.002-0.054) and the
# classifier head (observed norm ~0.97). sigma is pinned to 1.0 across all
# 4 sweep points so epsilon is identical everywhere (verified via
# RDPAccountant: 19.0163 at every C0 in this sweep) — the only thing that
# changes point to point is the absolute noise std (C0 * sigma) and how much
# of the true gradient signal each clip threshold preserves.
#
# 0.22 ~= sqrt(0.05 * 0.97), the geometric-mean midpoint between the
# encoder's deepest-layer scale and the head's scale. At this point the
# noise (std=0.22) is small enough to meaningfully soften the head's clip
# but still ~4-100x larger than any individual encoder layer's true
# gradient norm — the "compromise" point expected to help neither regime
# cleanly, illustrating that a single global C0 cannot serve both scales at
# once no matter where in the range it sits.
clipping_strategy: baseline_flat
sweep_c0: 0.22
sigma: 1.0
num_rounds: 20
num_seeds: 5
num_silos: 5
model: pubmedbert
dataset: mimic4
dirichlet_alpha: 0.5
global_c0: 0.22
