[project]
name = "etl-worker"
version = "0.1.0"
description = "ETL worker — transforms MIMIC-IV CSV exports into HL7 FHIR R4 transaction bundles"
readme = "README.md"
authors = [
    { name = "Anonymous", email = "anonymous@review.placeholder" }
]
requires-python = ">=3.13"
dependencies = [
    "fhir-resources>=7.1.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
]

[project.scripts]
etl-worker = "etl_worker:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
