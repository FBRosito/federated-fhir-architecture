[project]
name = "fl-fhir-architecture"
version = "0.1.0"
description = "Federated Learning over FHIR data — microservices workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bitsandbytes",
    "fhir-resources>=8.2.0",
    "flwr>=1.27.0",
    "pandas>=3.0.1",
    "peft>=0.18.1",
    "requests>=2.33.0",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "transformers>=5.4.0",
]

[tool.uv.workspace]
members = [
    "etl_worker",
    "ai_client",
    "fl_server",
    "evaluation",
]

# PyTorch CUDA 12.4 — usado em ambientes com GPU (Linux/Windows)
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
