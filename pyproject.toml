[project]
name = "fl-fhir-architecture"
version = "0.1.0"
description = "Federated Learning over FHIR data — microservices workspace"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "etl_worker",
    "ai_client",
    "fl_server",
    "evaluation",
]

# PyTorch CUDA 12.4 — required for GPU environments (Linux/Windows)
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
