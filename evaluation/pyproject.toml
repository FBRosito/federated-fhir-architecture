[project]
name = "evaluation"
version = "0.1.0"
description = "Evaluation suite — ICD-10 coding metrics, summarization metrics, LLM-as-judge, statistical analysis"
readme = "README.md"
authors = [
    { name = "Anonymous", email = "anonymous@review.placeholder" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
evaluation = "evaluation.post_eval:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
