[project]
name = "ai-client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anonymous", email = "anonymous@review.placeholder" }
]
requires-python = ">=3.13"
dependencies = [
    "bitsandbytes>=0.43.0,<0.46.0",
    "bert-score>=0.3.13",
    "evaluation",
    "flwr>=1.10.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "opacus>=1.4.0",
    "pandas>=2.0.0",
    "peft>=0.10.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.5.0",
    "torch>=2.6.0",
    "transformers>=4.44.0,<5.0.0",
]

[project.scripts]
ai-client             = "ai_client:main"
centralized-baseline  = "ai_client.centralized_baseline:main"

[tool.uv.sources]
evaluation = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
